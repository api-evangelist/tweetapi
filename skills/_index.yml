observations:
  - >-
    The skill draws a boundary narrower than the API. TweetAPI's REST surface includes posting,
    engagement, profile mutation, X Chat and legacy DMs; the skill forbids all of them and forbids
    the agent from ever handling authToken, ct0, TOTP codes, proxy credentials or message content.
  - >-
    It also imposes quota discipline an agent would not otherwise infer: no auto-pagination, no
    silent retry, no live smoke tests, one live call and one page by default, and an explicit
    statement to the user that a call consumes quota.
  - >-
    It instructs agents not to invent an OpenAPI URL, Postman collection, SDK method or MCP tool
    name — the provider's own acknowledgement that neither a public OpenAPI nor a Postman collection
    exists.
