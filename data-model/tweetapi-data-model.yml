note: >-
  Derived from the provider's published endpoint catalog (76 endpoints, generated 2026-07-29), not
  from an OpenAPI — TweetAPI publishes none, so there are no component schemas or $refs to walk.
  Entities and relationships below are inferred from endpoint paths, required identifier parameters
  and the documented shared Tweet-object notes. Field-level shapes are NOT modelled here because the
  provider does not publish response schemas; only identifier relationships that appear as real
  request parameters are recorded.
identifiers:
  style: string snowflake ids
  note: All ids are strings (Twitter/X snowflake), timestamps are ISO 8601, cursors are opaque strings.
entities:
  - name: User
    key: userId
    alternate_keys: [username]
    endpoints: 16
    operations:
      - GET /tw-v2/user/by-username
      - GET /tw-v2/user/by-usernames
      - GET /tw-v2/user/by-id
      - GET /tw-v2/user/by-ids
      - GET /tw-v2/user/about-account
    note: Batch lookups accept up to 50 usernames or ids.
  - name: Tweet
    key: tweetId
    endpoints: 5
    operations:
      - GET /tw-v2/tweet/details
      - GET /tw-v2/tweet/details-by-ids
      - GET /tw-v2/tweet/retweets
      - GET /tw-v2/tweet/quotes
      - POST /tw-v2/tweet/translate
    variants:
      - {type: quote, note: 'a reaction post is returned as a quote with reactionContext.isReaction true'}
    fields_documented: [reactionContext.isReaction, reactionContext.targetTweetId, reactionContext.targetTweetUrl, reactionContext.targetAuthor]
  - name: List
    key: listId
    endpoints: 7
    operations: [GET /tw-v2/list/details, GET /tw-v2/list/tweets, GET /tw-v2/list/members, GET /tw-v2/list/followers, POST /tw-v2/list/create, POST /tw-v2/list/add-member, POST /tw-v2/list/remove-member]
  - name: Community
    key: communityId
    endpoints: 12
    operations: [GET /tw-v2/community/details, GET /tw-v2/community/tweets, GET /tw-v2/community/members, GET /tw-v2/community/search]
  - name: Space
    key: spaceId
    endpoints: 2
    operations: [GET /tw-v2/space/by-id, GET /tw-v2/space/stream-url]
    note: stream-url is keyed by mediaKey rather than spaceId.
  - name: Conversation
    key: conversationId
    endpoints: 13
    note: >-
      Two distinct DM systems share this entity — X Chat (encrypted, /tw-v2/xchat/*) and the legacy
      unencrypted DM surface (/tw-v2/interaction/inbox-*, conversation, send-dm). 1-on-1 ids take the
      composite form 'userId1-userId2'; group conversations use a single id.
  - name: Profile
    key: authToken
    endpoints: 3
    operations: [POST /tw-v2/profile/update, POST /tw-v2/profile/avatar, POST /tw-v2/profile/banner]
    note: The acting account is identified by the supplied session token, not by an id parameter.
  - name: Notification
    key: null
    endpoints: 1
    operations: [GET /tw-v2/interaction/notifications]
