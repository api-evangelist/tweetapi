  quote: >-
    "TweetAPI's tw-v2 endpoints do not currently return Retry-After or X-RateLimit-* headers."
  note: >-
    This is the provider's own explicit statement, repeated in llms.txt, ai-docs-v2.txt and the docs
    overview. It is an unusually honest disclosure and also the single biggest agent-readiness gap on
    this API: an agent gets no runtime budget signal at all and cannot distinguish a 429 caused by
    allowance exhaustion from one caused by the per-minute ceiling except by parsing the error
    message string. Recommended provider fix: emit RateLimit-Limit/RateLimit-Remaining/RateLimit-Reset
    (RFC 9331 draft) plus Retry-After on 429.
client_guidance_published:
  - Inspect the 429 error message before retrying — it distinguishes allowance exhaustion from a per-minute limit
  - Use bounded backoff and lower concurrency for transient per-minute limits
  - Do not auto-paginate; each page is a billed request
mcp_note: >-
  Live calls through the hosted MCP server at https://mcp.tweetapi.com/mcp are forwarded to the REST
  API and consume the quota of the API key selected during OAuth authorization. The MCP surface adds
  no separate limit.
