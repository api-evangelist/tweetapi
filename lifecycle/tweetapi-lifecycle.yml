status_page:
  url: https://tweetapi.com/status
  http_status: 200
  hosted: first-party
  external_provider: null
  note: >-
    A first-party status page at tweetapi.com/status titled "TweetAPI uptime and availability" and
    described as live service-level monitoring with recent availability history. The page shell is
    server-rendered and the availability data loads client-side from a dashboard-authenticated
    endpoint (GET https://tweetapi.com/api/status returns 401 anonymously), so the numbers are not
    machine-readable to an unauthenticated agent. An unauthenticated liveness endpoint does exist:
    GET https://tweetapi.com/api/health returns {"ok":true}.
