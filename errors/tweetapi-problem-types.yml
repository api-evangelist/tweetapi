problems:
  - status: 400
    code: BAD_REQUEST
    title: Bad Request
    detail: Invalid parameters
    remediation: Check required parameter names, types and value formats against the endpoint reference.
  - status: 401
    code: UNAUTHORIZED
    title: Unauthorized
    detail: Invalid API key
    remediation: >-
      Send a valid key in the X-API-Key header. A missing key returns
      {"statusCode":401,"message":"No API key provided"}.
  - status: 404
    code: NOT_FOUND
    title: Not Found
    detail: Resource doesn't exist
    remediation: Verify the path and the identifier; deleted or protected Twitter/X resources also surface as 404.
  - status: 429
    code: RATE_LIMIT
    title: Too Many Requests
    detail: >-
      Ambiguous by design — indicates either plan request-allowance exhaustion or the per-minute
      ceiling. No Retry-After or X-RateLimit-* header accompanies it.
    remediation: >-
      Inspect the message string before retrying. Back off with bounds and lower concurrency for a
      per-minute limit; upgrade the plan or wait for the next period for allowance exhaustion.
    see_also: rate-limits/tweetapi-rate-limits.yml
  - status: 500
    code: INTERNAL_ERROR
    title: Internal Server Error
    detail: Unhandled server-side failure.
    remediation: Retry with backoff; contact support via https://t.me/tweetapi if persistent.
gaps:
  - No machine-resolvable error type URIs (no RFC 9457 type registry)
  - No error code enum published per endpoint
  - No 403 semantics published despite account-authorized endpoints that can be refused upstream by X
  - 429 conflates two distinct exhaustion conditions with no header to disambiguate
