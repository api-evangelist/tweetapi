method: searched
source: https://tweetapi.com/docs/getting-started/overview
corroborating_source: https://tweetapi.com/ai-docs-v2.txt
format: custom-json
rfc9457: false
envelope:
  media_type: application/json
  shape: '{"statusCode": <int>, "message": "<string>"}'
  fields:
    - {name: statusCode, type: integer, description: HTTP status code repeated in the body}
    - {name: message, type: string, description: Human-readable failure reason}
  note: >-
    Not RFC 9457 problem+json — no type URI, no title/detail/instance, no problem registry, and the
    response is served as application/json rather than application/problem+json. The published
    "ADDITIONAL INFORMATION" section of ai-docs-v2.txt describes errors as an "error object with code
    and message", while the docs overview and live responses show the flat statusCode/message shape;
    the live shape is recorded here as authoritative.
